[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "trailblazer"
version = "1.0.0"
description = "Red Team OPSEC & Forensic Footprint Analyzer"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.8"
authors = [
    { name = "mr7security", email = "mrebolledo@serviplana.es" }
]
keywords = [
    "red-team", "pentesting", "forensics", "opsec",
    "incident-response", "security", "oscp", "evasion"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Information Technology",
    "Topic :: Security",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
]
dependencies = [
    "psutil>=5.9.0",
    "rich>=13.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "flake8>=6.0",
    "black>=23.0",
]

[project.scripts]
trailblazer = "trailblazer:main"

[project.urls]
Homepage   = "https://github.com/mr7security/trailblazer"
Repository = "https://github.com/mr7security/trailblazer"
Issues     = "https://github.com/mr7security/trailblazer/issues"

[tool.black]
line-length    = 100
target-version = ["py38", "py39", "py310", "py311"]

[tool.pytest.ini_options]
testpaths    = ["tests"]
python_files = ["test_*.py"]
addopts      = "-v --tb=short"

[tool.flake8]
max-line-length = 100
exclude         = [".git", "__pycache__", "venv", "build", "dist"]
